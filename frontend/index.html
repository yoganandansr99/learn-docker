<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>User Management System</h1>
        </header>
        
        <main>
            <section class="form-section">
                <h2>Add New User</h2>
                <form id="userForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your name">
                    </div>
                    
                    <div class="form-group">
                        <label for="education">Education</label>
                        <input type="text" id="education" name="education" required placeholder="Enter your education">
                    </div>
                    
                    <div class="form-group">
                        <label for="college">College</label>
                        <input type="text" id="college" name="college" required placeholder="Enter your college">
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" required placeholder="Enter your location">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Add User</button>
                </form>
            </section>
            
            <section class="users-section">
                <h2>Registered Users</h2>
                <div id="usersList" class="users-list">
                    <!-- Users will be displayed here -->
                </div>
            </section>
        </main>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
